[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachintent"
version = "0.1.0"
description = "Pedagogical intent driven speech planning: specification-to-contract layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/teachintent"]
